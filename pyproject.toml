[project]
name = "reports-wagent"
version = "0.1.0"
description = "A minimal Telegram frontend for a DeepSeek-powered LangChain Deep Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.1",
    "faster-whisper>=1.2.1",
    "langchain-deepseek>=1.1.0",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp<2",
    "openai>=2.52.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.8",
]

[tool.uv.workspace]
members = [
    "agent_workspace/workspace/2026_Total_List/trading",
]
